[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prop-plus-price-trainer"
version = "0.1.0"
description = "PropPlus hedonic LightGBM price trainer"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "psycopg[binary]>=3.1.18",
    "boto3>=1.34.0",
    "scikit-learn>=1.4.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.17.0",
    "onnxruntime>=1.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
